[package]
name = "money-manager"
version = "3.0.0"
edition = "2021"
rust-version = "1.89"
default-run = "money-manager"

[lib]
name = "money_manager"
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "serialize", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
csv = "1"
sha2 = "0.10"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "money-manager"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "export_types"
path = "examples/export_types.rs"

# Windows bindings generate very large debug information on the GNU toolchain.
[profile.dev.package.windows]
debug = false
codegen-units = 1
